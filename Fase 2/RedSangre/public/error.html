<!doctype html>
<!-- Comentarios - Manejo de errores y excepciones -->
<!-- Página de error del servidor (403, 404 de archivos y 500). Reemplaza la página de Apache, que muestra la versión del servidor. -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedSangre</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background-color: #f5f7fa;
      color: #333333;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }
    .tarjeta {
      max-width: 460px;
      padding: 32px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 24px; color: #bb4442; }
    p { margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background-color: #bb4442;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>La página no está disponible</h1>
    <p>No se pudo mostrar lo que pediste. Vuelve al inicio e inténtalo nuevamente.</p>
    <a href="/">Ir al inicio</a>
  </div>
</body>
</html>
